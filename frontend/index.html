<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Integration test with this title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>var require = { paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.0/min/vs' } };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.0/min/vs/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.0/min/vs/editor/editor.main.nls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.0/min/vs/editor/editor.main.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 900px; }
        .repo-btn, .file-btn { width: 100%; text-align: left; margin: 3px 0; }
        .folder { cursor: pointer; font-weight: bold; }
        .file { cursor: pointer; padding-left: 20px; }
        .file:hover, .folder:hover { background-color: #e9ecef; }
        .selected { background-color: #007bff; color: white; }
        #editor-container { height: 400px; border: 1px solid #ccc; }
        .tree-container { border: 1px solid #ddd; padding: 10px; background: white; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">GitHub Integration</h2>

        <button class="btn btn-primary" onclick="showAddRepoModal()">➕ Add Git Folder</button>

        <h4 class="mt-4">Repositories:</h4>
        <div id="repo-list" class="d-grid gap-2"></div>

        <h4 class="mt-4">File Explorer:</h4>
        <div id="file-list" class="tree-container"></div>

        <h4 class="mt-4">Editor:</h4>
        <div id="editor-container"></div>

        <h4 class="mt-4">Branches:</h4>

<!-- Branch Selection Dropdown -->
<select id="branch-dropdown" class="form-select">
    <option disabled selected>Loading...</option>
</select>

<!-- Create New Branch Button -->
<button class="btn btn-info mt-2" onclick="createBranch()">➕ Create New Branch</button>  

<!-- Commit Message Input -->
<div class="mt-3">
    <label for="commit-message" class="form-label">Commit Message:</label>
    <input type="text" id="commit-message" class="form-control" placeholder="Enter your commit message">
</div>

<!-- Commit & Push Button -->
<button class="btn btn-success mt-3" onclick="commitAndPush()">💾 Commit & Push</button>

    </div>

    <!-- Add Repository Modal -->
    <div id="repoModal" class="modal" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <h5>Add Git Repository</h5>
                <input type="text" id="repo-url" class="form-control" placeholder="Enter Git Repository URL">
                <button class="btn btn-success mt-2" onclick="addGitRepo()">Add Repository</button>
                <button class="btn btn-secondary mt-2" onclick="closeRepoModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
